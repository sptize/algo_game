<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14281d"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><title>AlgoForja</title>
<style>
:root{--bg:#14281d;--card:#1d3a2a;--ink:#eaf6ee;--mut:#9cc0aa;--ac:#7be0a4;--warn:#ffd479}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:auto;padding:14px}
h1,h2,h3{margin:.3em 0}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#0003;border-radius:99px;padding:4px 10px;font-size:14px}
button{font:inherit;color:inherit;background:#2c553d;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:#06210f;font-weight:700;margin-top:8px}
button:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.code{font:13px ui-monospace,monospace;white-space:pre;overflow-x:auto}
.ok{background:#2f7a4d!important}.no{background:#8a3a3a!important}
pre{background:#0b1a12;border-radius:10px;padding:10px;overflow:auto;max-height:45vh;font:13px/1.5 ui-monospace,monospace;margin:8px 0}
.ln{display:block;cursor:pointer;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #fff2;padding:5px;text-align:center}
.bar{height:8px;background:#0004;border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.chip{display:inline-block;margin:4px;padding:7px 11px;background:#2c553d;border-radius:10px;font:14px ui-monospace,monospace;cursor:pointer}
.blank{display:inline-block;min-width:60px;border-bottom:2px dashed var(--ac);padding:0 6px;color:var(--warn);cursor:pointer;text-align:center}
.node{display:flex;gap:10px;align-items:center;width:100%;margin:6px 0}
textarea,input{width:100%;background:#0b1a12;color:var(--ink);border:1px solid #fff3;border-radius:10px;padding:10px;font:13px ui-monospace,monospace;margin:6px 0}
textarea{height:240px}
.mut{color:var(--mut)}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const KW=new Set('def for while if elif else return break continue in not and or is None True False range len print import from class pass lambda with as try except self append get put add pop empty min max sum abs int float str list dict set tuple PriorityQueue Queue heappush heappop'.split(' '));
const TOK=/(?<![\w)\]]\s*)-\d+\.?\d*|[A-Za-z_]\w*|\d+\.?\d*|==|!=|<=|>=|[<>]/g;
const RANGOS=[[0,'Aprendiz'],[100,'Mecánico'],[300,'Ingeniero inverso'],[600,'Arquitecto']];
const MODES=[['rx','🩻','Radiografía','Pasos 1-5: ¿qué papel tiene cada parte?'],['hu','🧩','Huecos','Niveles 2-3: completa lo que falta'],['or','🔀','Ordenar','Paso 5: reordena un bloque'],['tr','🗣️','Traductor','Paso 7: de palabras a código'],['bg','🐞','Caza-errores','Nivel 4: halla la línea alterada'],['ci','🧠','A ciegas','Paso 8: reconstruye con solo el esqueleto']];
const EJ=`def buscar(lista, buscado):\n    posicion = -1\n    for i in range(len(lista)):\n        if lista[i] == buscado:\n            posicion = i\n            break\n    return posicion`;

// ---- análisis del código (reglas propias) ----
function parse(code){return code.replace(/\t/g,'    ').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()&&!/^\s*(#|\/\/)/.test(l)).map(t=>{const s=t.trim();
 const k=/^def\s/.test(s)?'def':/^(for|while)\b/.test(s)?'loop':/^(if|elif|else)\b/.test(s)?'cond':/^return\b/.test(s)?'ret':/^(break|continue)\b/.test(s)?'jump':/^[\w.\[\], ()]+?\s*[-+*\/]?=(?!=)/.test(s)?'asg':'seq';
 return{t,s,k}})}
function info(L){const d=L.find(l=>l.k=='def'),m=d&&d.s.match(/^def\s+(\w+)\s*\((.*?)\)/);
 const par=m?m[2].split(',').map(x=>x.trim().replace(/[:=].*$/,'').trim()).filter(Boolean):[],vs=new Set(),rets=new Set();
 L.forEach(l=>{let x;if(l.k=='asg'&&(x=l.s.match(/^([A-Za-z_]\w*)/)))vs.add(x[1]);if(x=l.s.match(/^for\s+(\w+)/))vs.add(x[1]);
  if(l.k=='ret')(l.s.match(/[A-Za-z_]\w*/g)||[]).forEach(w=>{if(!KW.has(w))rets.add(w)})});
 return{name:m?m[1]:'(sin función)',par,vars:[...new Set([...par,...vs])],role:v=>par.includes(v)?0:rets.has(v)?2:1}}
const say=s=>{let m;
 if(m=s.match(/^def\s+(\w+)\s*\((.*?)\)/))return`Defino la función ${m[1]}, que recibe ${m[2]||'nada'}`;
 if(m=s.match(/^for\s+(.+?)\s+in\s+(.+?):?$/))return`Repito para cada ${m[1]} en ${m[2]}`;
 if(m=s.match(/^while\s+(.+?):?$/))return`Mientras ${m[1]}, repito`;
 if(m=s.match(/^elif\s+(.+?):?$/))return`Si no, y si ${m[1]}`;
 if(m=s.match(/^if\s+(.+?):?$/))return`Si ${m[1]}`;
 if(/^else/.test(s))return'En cualquier otro caso';
 if(m=s.match(/^return\s*(.*)$/))return m[1]?`Devuelvo ${m[1]}`:'Termino la función';
 if(s=='break')return'Termino el ciclo';if(s=='continue')return'Salto a la siguiente vuelta';
 if(m=s.match(/^(.+?)\s*([-+*\/]?)=\s*(.+)$/))return m[2]=='+'?`Sumo ${m[3]} a ${m[1]}`:m[2]=='-'?`Resto ${m[3]} a ${m[1]}`:m[2]?`Actualizo ${m[1]} con ${m[2]}= ${m[3]}`:`Guardo ${m[3]} en ${m[1]}`;
 return`Ejecuto ${s}`};
const SN=['Secuencia','Condición','Repetición','Retorno / salto'],SK={asg:0,seq:0,def:0,cond:1,loop:2,ret:3,jump:3};
const SW=['Se ejecuta en orden: ni decide ni repite.','Decide qué camino seguir según una condición.','Repite instrucciones durante un recorrido o mientras se cumpla una regla.','Entrega un resultado o altera el ciclo.'];
const ROLES=['Entrada (dato que recibe)','Variable interna (guarda estado)','Salida (lo que devuelve)'],RW=['Llega como parámetro.','Se crea y cambia dentro del algoritmo.','Es lo que se devuelve al final.'];
const MUT=[[/==/,'!=','Cambiar == por != invierte la condición.'],[/!=/,'==','Cambiar != por == invierte la condición.'],[/<=/,'<','Quitar el = excluye el caso de igualdad.'],[/>=/,'>','Quitar el = excluye el caso de igualdad.'],[/ < /,' > ','Invertir el comparador cambia qué caso se cumple.'],[/ > /,' < ','Invertir el comparador cambia qué caso se cumple.'],[/ \+ /,' - ','Cambiar + por - altera el cálculo.'],[/ - /,' + ','Cambiar - por + altera el cálculo.'],[/\band\b/,'or','and exige ambas condiciones; or solo una.'],[/\bor\b/,'and','or acepta una de las condiciones; and exige ambas.'],[/\b\d+\b/,m=>String(+m+1),'Se cambió un valor constante (error de uno de más o de menos).']];
const why=(L,I,i,t)=>`En «${L[i].s}» (${say(L[i].s)}): `+(I.par.includes(t)?`«${t}» es una entrada del algoritmo.`:/^(==|!=|<=|>=|<|>)$/.test(t)?`«${t}» es el comparador que decide la condición.`:/^-?\d/.test(t)?`«${t}» es un valor constante necesario aquí.`:`«${t}» es ${['una entrada','una variable interna','la variable que se devuelve'][I.role(t)]} del algoritmo.`);
const PQ=/priorityqueue|heapq|heappush|priority/i,HE=/heuristic|heur/i,CO=/cost_so_far|g_score|new_cost|dist/i,VI=/visited|explored|visitado/i;
const KB=[
{n:'Búsqueda lineal',k:[[/for\b.*\bin\b/,1],[/==/,1],[/\b(mid|medio|low|high|pivot)\b/i,-4],[/buscar|search|lineal|find/i,2],[/\bwhile\b/,-1]],o:'Encontrar un elemento en una colección y dar su posición.',e:'Fuerza bruta: compara uno por uno, en orden, hasta hallarlo o agotar la lista.',d:'Una lista (no necesita orden) y un índice de recorrido.',c:'O(n) tiempo, O(1) espacio.',r:['Olvidar el break o return al encontrarlo.','Devolver 0 en vez de -1 cuando no existe.'],t:'Si la lista está ordenada, la búsqueda binaria es mucho más rápida.'},
{n:'Búsqueda binaria',k:[[/\b(mid|medio)\b/i,3],[/\/\/ ?2|\/ ?2/,2],[/\b(low|lo|izq|left)\b/i,1],[/\b(high|hi|der|right)\b/i,1],[/binar/i,3],[/merge|sort|pivot/i,-4]],o:'Encontrar un elemento en una lista ORDENADA.',e:'Divide y vencerás: mira el centro y descarta la mitad donde no puede estar.',d:'Lista ordenada, dos límites (bajo y alto) y el punto medio.',c:'O(log n) tiempo.',r:['Usarla con la lista sin ordenar.','Límites mal actualizados (mid+1 / mid-1, < vs <=): provoca bucles infinitos.'],t:'El bucle típico es while bajo <= alto; actualiza siempre uno de los límites.'},
{n:'Ordenamiento burbuja',k:[[/j\s*\+\s*1/,2],[/for[\s\S]*for/,2],[/burbuja|bubble/i,3],[/\w\[[^\]]*\]\s*,\s*\w+\[[^\]]*\]\s*=|temp|aux/i,2]],o:'Ordenar una lista.',e:'Compara pares de vecinos y los intercambia si están desordenados; el mayor «sube» al final en cada pasada.',d:'Lista y dos ciclos anidados (pasadas y comparaciones).',c:'O(n²) tiempo, O(1) espacio.',r:['Pasarse del rango: j+1 debe existir.','Intercambiar sin variable auxiliar y perder un valor.'],t:'Con una bandera «hubo intercambio» puede cortar antes si ya está ordenada.'},
{n:'Ordenamiento por inserción',k:[[/\bkey\b/i,2],[/while\s+\w+\s*>=?\s*0/,3],[/insert|inserci/i,3]],o:'Ordenar una lista.',e:'Toma cada elemento y lo inserta en su lugar dentro de la parte ya ordenada, desplazando mayores.',d:'Lista, una clave (key) y un índice j que retrocede.',c:'O(n²) peor caso, O(n) si ya está casi ordenada.',r:['Olvidar colocar la clave al final (arr[j+1] = key).','Condición de while sin controlar j >= 0.'],t:'Es muy buena para listas pequeñas o casi ordenadas.'},
{n:'Merge sort',k:[[/merge|mezcl/i,4],[/\b(mid|medio)\b/i,1],[/left|right|izq|der/i,1]],o:'Ordenar una lista.',e:'Divide y vencerás: parte en mitades, ordena cada una recursivamente y las mezcla.',d:'Sublistas izquierda y derecha, índices de mezcla y recursión.',c:'O(n log n) siempre, O(n) espacio extra.',r:['Sin caso base (lista de 0 o 1 elementos).','No copiar los restos al terminar la mezcla.'],t:'Estable y de rendimiento predecible.'},
{n:'Quicksort',k:[[/pivot|pivote/i,4],[/quick/i,3],[/less|greater|menores|mayores|left|right/i,1]],o:'Ordenar una lista.',e:'Elige un pivote, separa menores y mayores, y ordena cada parte recursivamente.',d:'Pivote, particiones y recursión.',c:'O(n log n) promedio, O(n²) peor caso.',r:['Sin caso base.','Pivote siempre en un extremo con datos ya ordenados.'],t:'En la práctica suele ser el más rápido, pero no es estable.'},
{n:'Búsqueda en anchura (BFS)',k:[[/deque|popleft|pop\(0\)|queue/i,3],[VI,2],[/heuristic|priority|heap|cost|dist/i,-4],[/bfs|anchura|breadth/i,3]],o:'Hallar el camino con menos pasos en un grafo sin costos.',e:'Explora por niveles usando una cola FIFO: primero lo más cercano al inicio.',d:'Cola (frontera), visited y parent/came_from.',c:'O(V+E) tiempo y espacio.',r:['Marcar visitado al sacar de la cola (duplica nodos) en vez de al meterlo.','Usar pila en vez de cola.'],t:'Es completa y óptima cuando todos los pasos cuestan lo mismo.'},
{n:'Búsqueda en profundidad (DFS)',k:[[/stack|pila/i,2],[/\bpop\(\)/,1],[VI,1],[/dfs|profund|depth/i,3],[/queue|popleft|heap|priority/i,-4]],o:'Recorrer o buscar en un grafo yendo lo más profundo posible.',e:'Pila LIFO (o recursión): sigue una rama hasta el final y luego retrocede.',d:'Pila o recursión, y visited.',c:'O(V+E) tiempo; poca memoria.',r:['No marcar visitados y caer en ciclos.','No garantiza el camino más corto.'],t:'Útil para explorar todo, detectar ciclos y backtracking.'},
{n:'Búsqueda voraz (Greedy Best-First)',k:[[PQ,2],[HE,3],[/cost_so_far|g_score|new_cost/i,-4],[/greedy|voraz/i,3]],o:'Llegar a la meta siguiendo lo que parece más cercano.',e:'Cola de prioridad ordenada solo por h(n), la estimación hasta la meta.',d:'Cola de prioridad, heurística, explored y came_from.',c:'Depende de la heurística; no garantiza el camino óptimo.',r:['Creer que encuentra el menor costo.','Priorizar por costo acumulado: eso ya no es voraz.'],t:'Rápida pero puede dar rodeos. Compárala con A*.'},
{n:'A*',k:[[PQ,2],[HE,2],[/cost_so_far|g_score|new_cost/i,3],[/astar|a_star|a\*/i,3]],o:'Hallar el camino de menor costo guiándose por una heurística.',e:'Cola de prioridad con f(n) = g(n) + h(n): costo real acumulado más estimación restante.',d:'Cola de prioridad, cost_so_far, came_from y heurística.',c:'Depende de la heurística; óptimo si h es admisible.',r:['Priorizar solo por h o solo por g.','No actualizar costo y padre al hallar un camino mejor.'],t:'Revisa siempre: new_cost = g(actual) + costo de la arista, y priority = new_cost + h.'},
{n:'Dijkstra / costo uniforme',k:[[PQ,2],[CO,2],[HE,-4],[/dijkstra|uniforme/i,3]],o:'Hallar el camino de menor costo sin heurística.',e:'Cola de prioridad ordenada por g(n), el costo acumulado.',d:'Cola de prioridad, dist/cost_so_far y came_from.',c:'O((V+E) log V) con montículo.',r:['Costos negativos (no los admite).','No relajar la arista cuando hay un camino mejor.'],t:'Es A* con h(n) = 0.'},
{n:'Minimax',k:[[/minimax/i,4],[/maximiz/i,2],[/\b(max|min)\(/,1],[/alpha|beta/i,-2]],o:'Elegir la mejor jugada en un juego de dos jugadores.',e:'Recorre el árbol de jugadas: MAX elige el mayor valor y MIN el menor.',d:'Estado, jugadas posibles, profundidad y función de evaluación.',c:'O(b^d) tiempo.',r:['Olvidar el caso base (profundidad 0 o estado final).','Alternar mal MAX y MIN.'],t:'La poda alfa-beta da el mismo resultado explorando menos.'},
{n:'Poda alfa-beta',k:[[/alpha/i,3],[/beta/i,3],[/prun|poda|break/i,1]],o:'Minimax explorando menos nodos.',e:'Mantiene alfa (mejor de MAX) y beta (mejor de MIN) y corta ramas que no pueden mejorar el resultado.',d:'Las de minimax más alpha y beta.',c:'Mejor caso O(b^(d/2)).',r:['Actualizar alpha o beta en el jugador equivocado.','Cortar con la condición invertida (beta <= alpha).'],t:'Da el mismo valor que minimax; solo cambia la cantidad de nodos.'},
{n:'Algoritmo genético',k:[[/fitness|aptitud/i,3],[/crossover|cruce|cruza/i,3],[/mutat|mutaci/i,3],[/poblaci|population|ruleta|roulette/i,2]],o:'Buscar buenas soluciones imitando la evolución.',e:'Evalúa una población, selecciona (p. ej. ruleta), cruza, muta y repite por generaciones.',d:'Población, función de aptitud, selección, cruce y mutación.',c:'Depende de población y generaciones.',r:['Aptitud mal definida.','Mutación o población demasiado pequeñas: converge muy pronto.'],t:'Recuerda el ciclo: evaluar, seleccionar, cruzar, mutar.'},
{n:'Algoritmo de Euclides (MCD)',k:[[/%/,2],[/while\s+b|gcd|mcd/i,3]],o:'Calcular el máximo común divisor.',e:'Reemplaza (a, b) por (b, a mod b) hasta que b sea 0.',d:'Dos enteros.',c:'O(log min(a,b)).',r:['Actualizar a y b en el orden incorrecto.'],t:'Haz la traza con (48, 18) para verlo.'},
{n:'Recursión (factorial / Fibonacci)',k:[[/fact|fib/i,4]],o:'Resolver un problema en función de versiones menores de sí mismo.',e:'Caso base que detiene la recursión y caso recursivo que reduce el problema.',d:'La pila de llamadas.',c:'Factorial O(n); Fibonacci ingenuo O(2^n).',r:['Olvidar el caso base.','No acercarse al caso base en cada llamada.'],t:'Escribe primero el caso base y luego el recursivo.'}];
const detect=code=>{let b=null,sc=0;KB.forEach(x=>{const s=x.k.reduce((a,[re,w])=>a+(re.test(code)?w:0),0);if(s>sc){sc=s;b=x}});return sc>=4?b:null};

// ---- generadores de retos ----
const GEN={
rx(L){const I=info(L),B=shuf(L.filter(l=>l.k!='def')).slice(0,3).map(l=>{const a=SK[l.k];return{t:'quiz',q:'¿Qué estructura de control es esta línea?',code:l.t,o:SN,a,w:`«${say(l.s)}» es ${SN[a].toLowerCase()}: ${SW[a]}`,bad:i=>`Elegiste «${SN[i]}» (${SW[i]}) Pero «${say(l.s)}» es ${SN[a].toLowerCase()}: ${SW[a]}`}});
 return B.concat(shuf(I.vars).slice(0,2).map(v=>{const a=I.role(v),w=[`«${v}» es parámetro de ${I.name}(${I.par.join(', ')}): llega desde fuera.`,`«${v}» no llega como parámetro ni se devuelve directamente: guarda estado dentro del algoritmo.`,`«${v}» aparece en un return: es lo que entrega el algoritmo.`][a];return{t:'quiz',q:`¿Qué papel tiene «${v}» en este algoritmo?`,code:L.map(l=>l.t).join('\n'),o:ROLES,a,w,bad:i=>`Elegiste «${ROLES[i]}», pero ${w}`}}))},
hu(L){const I=info(L),C=[];L.forEach((l,i)=>{if(l.k!='def')for(const m of l.t.matchAll(TOK))if(!KW.has(m[0]))C.push([i,m[0]])});
 const mk=n=>{const by=shuf([...new Set(C.map(c=>c[0]))]).slice(0,n).sort((a,b)=>a-b);if(!by.length)return 0;
  const rows=L.map(l=>l.t),ans=[],W=[];
  by.forEach(i=>{const m=pick1([...L[i].t.matchAll(TOK)].filter(m=>!KW.has(m[0])));rows[i]=rows[i].slice(0,m.index)+'___'+rows[i].slice(m.index+m[0].length);ans.push(m[0]);W.push(why(L,I,i,m[0]))});
  const d=shuf([...new Set(C.map(c=>c[1]))].filter(x=>!ans.includes(x))).slice(0,3);
  return{t:'fill',q:`Completa ${by.length} hueco${by.length>1?'s':''}`,code:rows.join('\n'),bank:shuf(ans.concat(d)),ans,why:W,sol:L.map(l=>l.t).join('\n'),w:'Código completo. Fíjate en qué variables existen antes de cada línea.'}};
 return[mk(1),mk(2),mk(4)].filter(Boolean)},
or(L){const mk=n=>{n=Math.min(n,L.length);if(n<3)return 0;const s=Math.floor(Math.random()*(L.length-n+1)),it=L.slice(s,s+n).map(l=>l.t);return{t:'order',q:'Ordena este bloque del algoritmo',items:it,sol:it.join('\n'),w:'La indentación te dice qué va dentro de qué.'}};return[mk(4),mk(7)].filter(Boolean)},
tr(L){const B=L.filter(l=>l.k!='def'),U=[...new Set(B.map(l=>l.s))];if(U.length<2)return[];
 return shuf(B).slice(0,5).map(l=>{const o=shuf([l.s,...shuf(U.filter(x=>x!=l.s)).slice(0,3)]);return{t:'quiz',m:1,q:`«${say(l.s)}». ¿Qué línea es?`,o,a:o.indexOf(l.s),w:`Correcto: ${l.s} se lee «${say(l.s)}».`,bad:i=>`Elegiste «${o[i]}», que se lee «${say(o[i])}». La línea que dice «${say(l.s)}» es ${l.s}.`}})},
bg(L){const mk=()=>{const c=[];L.forEach((l,i)=>{if(l.k!='def')MUT.forEach(([re,r,d])=>{const n=l.t.replace(re,r);if(n!=l.t)c.push([i,n,d])})});
  if(!c.length)return 0;const[i,n,d]=pick1(c),rows=L.map(l=>l.t);rows[i]=n;
  return{t:'pick',q:'Alguien alteró UNA línea. ¿Cuál es?',lines:rows,a:i,w:`Antes decía: ${L[i].s}. Ahora: ${n.trim()}. ${d}`,bad:j=>`La línea ${j+1} está bien: «${say(rows[j].trim())}». La alterada es la ${i+1}: antes «${L[i].s}», ahora «${n.trim()}». ${d}`}};
 return[mk(),mk(),mk()].filter(Boolean)},
ci(L){return[{t:'blind',q:'Reconstruye el código desde el esqueleto',ref:L.map(l=>l.t),sol:L.map(l=>l.t).join('\n'),sk:L.map(l=>l.t.slice(0,l.t.length-l.s.length)+(l.k=='asg'?l.s.match(/^[^=+\-*\/ ]+/)[0]+' …':l.s.split(/[\s(:]/)[0]+' …')).join('\n')}]}};

// ---- estado (IndexedDB) ----
let S={xp:0,streak:0,last:'',algs:[]},R,hearts,mist,VV=[];
const db=new Promise(r=>{try{const q=indexedDB.open('algoforja',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const load=async()=>{const d=await db;return d?new Promise(r=>{const g=d.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r()}):0};
const save=async()=>{const d=await db;if(d)d.transaction('k','readwrite').objectStore('k').put(S,'s')};
const alg=id=>S.algs.find(a=>a.id==id);

// ---- pantallas ----
function home(){const c=[...RANGOS].reverse().find(r=>S.xp>=r[0]),nx=RANGOS.find(r=>r[0]>S.xp);
 A.innerHTML=`<div class=top><h1>⚙️ AlgoForja</h1><span class=pill>🔥 ${S.streak}</span></div>
 <div class=card><b>${c[1]}</b> · ${S.xp} XP<div class=bar><i style="width:${nx?(S.xp-c[0])/(nx[0]-c[0])*100:100}%"></i></div></div>`
 +(S.algs.length?S.algs.map(a=>{const t=MODES.reduce((s,m)=>s+(a.st[m[0]]||0),0);return `<button class="card node" onclick="algo(${a.id})"><span style="flex:1;text-align:left"><b>${esc(a.n)}</b><div class=bar><i style="width:${t/(MODES.length*3)*100}%"></i></div></span><span>${t}/${MODES.length*3} ⭐</span></button>`}).join(''):'<p class=mut>Pega el código de un algoritmo y la app lo convierte en juego.</p>')
 +`<button class=p onclick=frm(0)>➕ Nuevo algoritmo</button>`}
function frm(id){const a=id?alg(id):{n:'',code:''};
 A.innerHTML=`<button onclick="${id?`algo(${id})`:'home()'}">← Volver</button><h2>${id?'✏️ Editar':'➕ Nuevo'} algoritmo</h2><input id=nm placeholder="Nombre (ej. Búsqueda binaria)" value="${esc(a.n)}"><textarea id=cd placeholder="Pega aquí tu código (Python funciona mejor)">${esc(a.code)}</textarea><button onclick=ex()>💡 Probar con un ejemplo</button> <button class=p onclick="sv(${id})">Guardar</button><p id=er class=mut></p>`}
function ex(){$('#nm').value='Búsqueda lineal';$('#cd').value=EJ}
function sv(id){const n=$('#nm').value.trim(),c=$('#cd').value;if(!n||parse(c).length<3)return $('#er').textContent='Pon un nombre y al menos 3 líneas de código.';
 if(id){const a=alg(id);if(a.code!=c)a.st={};a.n=n;a.code=c}else{id=Date.now();S.algs.push({id,n,code:c,st:{}})}save();algo(id)}
function del(id){if(confirm('¿Borrar este algoritmo?')){S.algs=S.algs.filter(a=>a.id!=id);save();home()}}
function algo(id){const a=alg(id),L=parse(a.code),I=info(L),n=k=>L.filter(l=>l.k==k).length;
 A.innerHTML=`<button onclick=home()>← Volver</button> <button onclick="frm(${id})">✏️</button> <button onclick="del(${id})">🗑️</button><h2>${esc(a.n)}</h2>
 <div class="card mut"><small>${L.length} líneas · función ${esc(I.name)}</small><br>Entradas: ${esc(I.par.join(', ')||'—')}<br>Variables: ${esc(I.vars.join(', ')||'—')}<br>Estructuras: ${n('loop')} ciclo(s) · ${n('cond')} condición(es) · ${n('ret')} retorno(s)</div>`
 +`<button class="node p" onclick="learn(${id})"><span style="font-size:24px">📖</span><span style="flex:1;text-align:left"><b>Aprender este algoritmo</b><br><small>Explicación, pseudocódigo y línea por línea</small></span></button>`+MODES.map(m=>`<button class=node onclick="start(${id},'${m[0]}')"><span style="font-size:24px">${m[1]}</span><span style="flex:1;text-align:left"><b>${m[2]}</b><br><small class=mut>${m[3]}</small></span><span>${'⭐'.repeat(a.st[m[0]]||0)||'▶️'}</span></button>`).join('')
 +`<button class=node onclick="sim(${id})"><span style="font-size:24px">🧮</span><span style="flex:1;text-align:left"><b>Simulación manual</b><br><small class=mut>Paso 6: tabla de seguimiento</small></span></button>`}
function sim(id){VV=info(parse(alg(id).code)).vars.slice(0,7);
 A.innerHTML=`<button onclick="algo(${id})">← Volver</button><h2>🧮 Simulación manual</h2><p class=mut>Elige datos pequeños y anota cómo cambia cada variable. Por cada línea pregúntate: ¿qué valor tiene antes? ¿y después? ¿qué se perdería si no se ejecutara?</p><div style="overflow-x:auto"><table id=tb><tr><th>#</th>${VV.map(v=>`<th>${esc(v)}</th>`).join('')}</tr></table></div><button onclick=addRow()>+ fila</button>`;addRow();addRow()}
function addRow(){const t=$('#tb'),r=t.insertRow();r.innerHTML=`<td>${t.rows.length-1}</td>`+VV.map(()=>'<td contenteditable style="min-width:48px"></td>').join('')}

// ---- juego ----
function start(id,mode){const ch=GEN[mode](parse(alg(id).code));if(!ch.length)return alert('Este código no da para este modo (muy corto o le faltan elementos).');R={id,mode,ch,i:0};hearts=3;mist=0;draw()}
function draw(){const s=R.ch[R.i],md=MODES.find(m=>m[0]==R.mode);
 let h=`<div class=top><button onclick="algo(${R.id})">✕</button><small>${md[1]} ${md[2]} · ${R.i+1}/${R.ch.length}</small><span id=hp>${'❤️'.repeat(hearts)}</span></div><div class=card><h3>${esc(s.q)}</h3>`;
 if(s.code&&s.t=='quiz')h+=`<pre>${esc(s.code)}</pre>`;
 A.innerHTML=h+'<div id=z></div><div id=fb></div></div>';T[s.t](s)}
function miss(msg){mist++;hearts--;$('#hp').textContent='❤️'.repeat(Math.max(hearts,0))||'💔';
 const s=R.ch[R.i],d=hearts<=0;
 $('#fb').innerHTML=`<p>❌ ${esc(msg||'')}</p>`+(d?`<p>💔 Te quedaste sin vidas. Esta era la solución:</p>${s.sol?`<pre>${esc(s.sol)}</pre>`:''}<button class=p onclick="start(R.id,R.mode)">Reintentar</button>`:'');
 if(d)$('#z').style.pointerEvents='none';return d}
const cont=()=>{const l=R.i==R.ch.length-1;return`<button class=p onclick="${l?'fin()':'nx()'}">${l?'Terminar ✓':'Continuar →'}</button>`};
function nx(){R.i++;draw()}
function win(w){$('#z').style.pointerEvents='none';$('#fb').innerHTML=`<p>✅ ${esc(w||'¡Bien!')}</p>`+cont()}
function fin(){const st=mist==0?3:mist<=2?2:1,a=alg(R.id),pv=a.st[R.mode]||0;if(st>pv){S.xp+=10*(st-pv);a.st[R.mode]=st}
 const t=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();if(S.last!=t){S.streak=S.last==y?S.streak+1:1;S.last=t}
 save();A.innerHTML=`<div class=card style="text-align:center"><h2>${'⭐'.repeat(st)}</h2><p>${mist?mist+' fallo(s)':'¡Sin fallos!'} · ${S.xp} XP</p><button class=p onclick="start(R.id,R.mode)">🔁 Otra ronda</button> <button onclick="algo(R.id)">Volver</button></div>`}
const bind=s=>{const els=[...document.querySelectorAll('#z [data-i]')];els.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
 if(i==s.a){b.classList.add('ok');win(s.w)}
 else{b.classList.add('no');const c=els.find(e=>+e.dataset.i==s.a);if(c)c.classList.add('ok');$('#z').style.pointerEvents='none';
  if(!miss(s.bad?s.bad(i):(s.w||'')))$('#fb').insertAdjacentHTML('beforeend',cont())}})};
const T={
quiz(s){$('#z').innerHTML=shuf(s.o.map((t,i)=>[t,i])).map(([t,i])=>`<button class="opt ${s.m?'code':''}" data-i=${i}>${esc(t)}</button>`).join('');bind(s)},
pick(s){$('#z').innerHTML='<pre>'+s.lines.map((l,i)=>`<span class=ln data-i=${i}>${esc(l)||' '}</span>`).join('')+'</pre>';bind(s)},
order(s){let pool=shuf(s.items.map((t,i)=>[t,i])),ch=[];
 const r=()=>{$('#z').innerHTML=ch.map(([t],j)=>`<button class="opt code ok" data-c=${j}>${esc(t)}</button>`).join('')+'<hr style="opacity:.2">'+pool.map(([t],j)=>`<button class="opt code" data-p=${j}>${esc(t)}</button>`).join('')+`<button class=p id=chk ${pool.length?'disabled':''}>Comprobar</button>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ch.push(pool.splice(+b.dataset.p,1)[0]);r()});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{pool.push(ch.splice(+b.dataset.c,1)[0]);r()});
  $('#chk').onclick=()=>{const k=ch.findIndex(([t],j)=>t!=s.items[j]);if(k<0)win(s.w);
   else if(!miss(`La posición ${k+1} no es «${say(ch[k][0].trim())}». Ahí va «${say(s.items[k].trim())}» (${s.items[k].trim()}). ${s.w} Lo que ya iba bien se queda en su sitio.`)){pool=shuf(pool.concat(ch.splice(k)));r()}}};r()},
fill(s){const P=s.code.split('___');let v=P.slice(1).map(()=>-1);
 const r=()=>{$('#z').innerHTML='<pre>'+P.map((p,j)=>esc(p)+(j<v.length?`<span class=blank data-b=${j}>${v[j]<0?'&nbsp;&nbsp;&nbsp;':esc(s.bank[v[j]])}</span>`:'')).join('')+'</pre>'
  +s.bank.map((t,i)=>`<span class=chip data-k=${i} style="${v.includes(i)?'opacity:.3;pointer-events:none':''}">${esc(t)}</span>`).join('')+'<br><button class=p id=chk>Comprobar</button>';
  document.querySelectorAll('[data-k]').forEach(c=>c.onclick=()=>{const j=v.indexOf(-1);if(j>=0){v[j]=+c.dataset.k;r()}});
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{v[+b.dataset.b]=-1;r()});
  $('#chk').onclick=()=>{const bad=v.map((x,j)=>x<0||s.bank[x]!==s.ans[j]);
   if(!bad.some(Boolean))win(s.w);else if(!miss(bad.map((b,j)=>b?`Hueco ${j+1}: iba «${s.ans[j]}». ${s.why[j]}`:'').filter(Boolean).join(' '))){v=v.map((x,j)=>bad[j]?-1:x);r()}}};r()},
blind(s){$('#z').innerHTML=`<pre>${esc(s.sk)}</pre><textarea id=tx placeholder="Escribe el código completo, sin mirar"></textarea><button class=p id=chk>Comprobar</button>`;
 $('#chk').onclick=()=>{const n=x=>x.replace(/\s+/g,''),u=$('#tx').value.split('\n').map(n).filter(Boolean),fal=[];
  s.ref.forEach(r=>{const j=u.indexOf(n(r));if(j<0)fal.push(r.trim());else u.splice(j,1)});const ok=s.ref.length-fal.length;
  if(ok/s.ref.length>=.85)win(`${ok}/${s.ref.length} líneas correctas.`+(fal.length?` Faltó: ${fal.map(x=>`${x} («${say(x)}»)`).join(' | ')}`:''));
  else miss(`Vas ${ok}/${s.ref.length}. Te falta, por ejemplo: «${say(fal[0])}» → ${fal[0]}`)}}};

// ---- apartado de aprendizaje ----
function learn(id){const a=alg(id),L=parse(a.code),I=info(L),K=detect(a.code),sp=l=>l.t.slice(0,l.t.length-l.s.length);
 const rets=L.filter(l=>l.k=='ret').map(l=>l.s.replace(/^return\s*/,'')).filter(Boolean).join(' / ')||'(no devuelve valor)';
 const vd=I.vars.map(v=>{const ls=L.filter(l=>l.k=='asg'&&l.s.split(/[^\w]/)[0]==v);return`<li><b>${esc(v)}</b> — ${ROLES[I.role(v)]}${ls.length?`. Empieza con «${esc(say(ls[0].s))}» y cambia en ${ls.length} línea(s).`:'.'}</li>`}).join('');
 const sec=(h,b)=>`<div class=card><h3>${h}</h3>${b}</div>`;
 A.innerHTML=`<button onclick="algo(${id})">← Volver</button><h2>📖 Aprender: ${esc(a.n)}</h2>`
 +sec('🎯 1. ¿Qué es y qué resuelve?',K?`<p>Se parece a <b>${esc(K.n)}</b> (lo reconocí por sus huellas digitales).</p><p><b>Objetivo:</b> ${esc(K.o)}</p><p><b>Estrategia:</b> ${esc(K.e)}</p>`:`<p>No reconocí un algoritmo clásico, así que lo analizo por su estructura: la función <b>${esc(I.name)}</b> recibe ${esc(I.par.join(', ')||'nada')} y devuelve ${esc(rets)}.</p>`)
 +sec('📥 2. Entradas, salida y variables',`<p><b>Entradas:</b> ${esc(I.par.join(', ')||'—')}</p><p><b>Salida:</b> ${esc(rets)}</p><ul>${vd}</ul>`)
 +sec('🗣️ 3. Lógica sin código',`<pre>${esc(L.map(l=>sp(l)+say(l.s)).join('\n'))}</pre><p class=mut>Cierra esto e intenta explicarlo con tus palabras.</p>`)
 +sec('🔎 4. Línea por línea','<div style="overflow-x:auto"><table>'+L.map(l=>`<tr><td class=code style="text-align:left">${esc(l.t)}</td><td style="text-align:left">${esc(say(l.s))}<br><small class=mut>${SN[SK[l.k]]}</small></td></tr>`).join('')+'</table></div>')
 +(K?sec('🧠 5. Lo que debes saber',`<p><b>Estructuras de datos:</b> ${esc(K.d)}</p><p><b>Complejidad:</b> ${esc(K.c)}</p><p><b>Errores frecuentes:</b></p><ul>${K.r.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p><b>Consejo:</b> ${esc(K.t)}</p>`):'')
 +sec('✅ ¿Ya lo entendí?',['Explico qué problema resuelve.','Identifico sus variables y estructuras.','Explico qué pasa en cada iteración.','Escribo su lógica sin mirar el código.','Lo reconstruyo desde cero.'].map(x=>`<label style="display:block"><input type=checkbox style="width:auto;margin:0 8px"> ${x}</label>`).join('')+`<button class=p onclick="algo(${id})">🎮 Ir a jugar</button>`)}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load().then(s=>{if(s)S=Object.assign(S,s);home()});
</script></body></html>
